<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a3a5c">
<title>Signing you in… · Meridian Tools</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e8a020'/%3E%3Ctext x='32' y='46' font-family='Segoe UI,Arial,sans-serif' font-size='38' font-weight='900' text-anchor='middle' fill='%231a3a5c'%3EM%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<style>
  :root{
    --brand:#1a3a5c; --brand-light:#2a5a8c; --brand-dark:#132c47;
    --accent:#e8a020; --accent-dark:#c8871a;
    --bg:#f0f4f8; --surface:#ffffff; --border:#d0dae6; --border-strong:#b6c5d6;
    --text:#1e2b3a; --muted:#5a6c83;
    --shadow:0 2px 12px rgba(26,58,92,.10);
    --radius:12px; --radius-sm:8px; --radius-lg:16px;
    --focus-ring:0 0 0 3px rgba(42,90,140,.25);
    --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  /* Shared .screen pattern — spec §11 */
  .screen {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 24px; text-align: center;
    font-family: var(--font); background: var(--brand); color: #fff;
    -webkit-font-smoothing: antialiased;
  }
  .screen-logo {
    width: 56px; height: 56px; background: var(--accent); border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 900; color: var(--brand);
  }
  .spinner {
    width: 36px; height: 36px; border: 4px solid rgba(255,255,255,.3);
    border-top-color: #fff; border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .screen p { font-size: 14px; font-weight: 600; opacity: .85; max-width: 340px; }
  .screen-err { display: none; font-size: 13px; font-weight: 500; opacity: 1; color: #ffd9d9; max-width: 360px; }
  .retry-btn {
    display: none; align-items: center; gap: 8px;
    background: #fff; color: var(--brand); border: none; min-height: 44px;
    padding: 12px 24px; border-radius: var(--radius-sm); font-size: 15px; font-weight: 700;
    cursor: pointer; margin-top: 4px; font-family: var(--font);
    transition: background .15s, transform .05s;
  }
  .retry-btn:hover { background: var(--bg); }
  .retry-btn:active { transform: translateY(1px); }
  .retry-btn:focus-visible { box-shadow: var(--focus-ring); outline: none; }
</style>
</head>
<body>
<div class="screen">
  <div class="screen-logo" aria-hidden="true">M</div>
  <div class="spinner" id="spinner" role="status" aria-label="Signing you in"></div>
  <p id="status-msg">Signing you in&hellip;</p>
  <p class="screen-err" id="err-msg"></p>
  <button class="retry-btn" id="retry-btn" onclick="location.reload()"><span aria-hidden="true">↻</span> Retry</button>
</div>
<script>
// This page only relays the Microsoft sign-in result back to the tool that
// requested it. It holds no data. It must remain publicly reachable
// (anonymous in staticwebapp.config.json) so the sign-in response is not
// intercepted by the site-wide login wall.

var forwardTimer = null;

function showError(message) {
  // Stop the safety-net auto-forward so the user can read the error and retry.
  if (forwardTimer) { clearTimeout(forwardTimer); forwardTimer = null; }
  var spinner = document.getElementById('spinner');
  spinner.style.display = 'none';
  spinner.removeAttribute('role');
  document.getElementById('status-msg').textContent = 'Sign-in didn’t complete';
  var err = document.getElementById('err-msg');
  err.textContent = message || 'Something went wrong while signing you in. Please try again.';
  err.style.display = 'block';
  document.getElementById('retry-btn').style.display = 'inline-flex';
}

// Safety net FIRST: whatever happens below (blocked CDN, MSAL error), the
// user is forwarded home after a few seconds instead of being stranded.
forwardTimer = setTimeout(function () { window.location.replace("/"); }, 4000);

(async () => {
  if (typeof msal === 'undefined') {
    // CDN blocked — let the safety-net timer forward home.
    document.getElementById('status-msg').textContent = 'Redirecting…';
    return;
  }
  try {
    const pca = new msal.PublicClientApplication({
      auth: {
        clientId: "ff1fd3ee-7baf-4d72-b978-742a29de8eab",
        authority: "https://login.microsoftonline.com/4fa4840a-2a70-49e0-93ab-fd8b099bbeed",
        redirectUri: window.location.origin + "/auth-return.html",
        navigateToLoginRequestUrl: true
      },
      cache: { cacheLocation: "localStorage", storeAuthStateInCookie: true }
    });
    await pca.initialize();
    // With navigateToLoginRequestUrl=true, MSAL caches the response and
    // navigates back to the page that started the sign-in automatically.
    await pca.handleRedirectPromise();
  } catch (e) {
    console.error(e);
    showError(e && e.message ? e.message : 'We couldn’t finish signing you in.');
  }
})();
</script>
</body>
</html>
